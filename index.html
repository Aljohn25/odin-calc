<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="javascript.js" defer></script>
</head>
<body>
    <header>
        <div id="page-title">
            <h1>CALCULATOR</h1>
        </div>
    </header>
    <main>
        <div id="calculator-body">
            <div>
                <input id="screen">
            </div>
            <div id="btn-last">
                <button class="btn-reset">RESET</button>
                <button class="btn-del">DEL</button>
            </div>
            <div id="btn-calc">
                <div class="button-first-set">
                    <button class="btn-nine">9</button>
                    <button class="btn-eight">8</button>
                    <button class="btn-seven">7</button>
                    <button class="btn-divide">/</button>
                </div>
                <div class="button-second-set">
                    <button class="btn-four">4</button>
                    <button class="btn-five">5</button>
                    <button class="btn-six">6</button>
                    <button class="btn-multiply">x</button>
                </div>
                <div class="button-third-set">
                    <button class="btn-one">1</button>
                    <button class="btn-two">2</button>
                    <button class="btn-three">3</button>
                    <button class="btn-subtract">&minus;</button>
                </div>
                <div class="button-fourth-set">
                    <button class="btn-dot">.</button>
                    <button class="btn-zero">0</button>
                    <button class="btn-equal">=</button>
                    <button class="btn-add">+</button>
                </div>
            </div>
            
        </div>
    </main>
    <footer>
        <div id="copyright">
            <p class="copyright-text">Copyright Ⓒ 2026 Calculator Project by Aljohn Moorhead. All rights reserved.</p>
        </div>
    </footer>
    
</body>
</html>
